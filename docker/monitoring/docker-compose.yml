# Glances — monitoramento de recursos da VPS nuvemax (painel web + API REST).
#
# Acesso atrás do Traefik com basicAuth (middleware monitor-auth@file,
# definido em docker/gateway/traefik/dynamic/monitor-auth.yml — o usuário/senha
# fica em docker/gateway/traefik/dynamic/monitor.htpasswd, não versionado).
#
# Uso:
#   cp .env.example .env   # defina MONITOR_DOMAIN
#   docker compose --env-file .env -f docker/monitoring/docker-compose.yml up -d
#
# API (exemplos):
#   https://<MONITOR_DOMAIN>/api/4/cpu
#   https://<MONITOR_DOMAIN>/api/4/mem
#   https://<MONITOR_DOMAIN>/api/4/fs
#   https://<MONITOR_DOMAIN>/api/4/all

name: nuvemax-monitor

services:
  glances:
    image: nicolargo/glances:latest-full
    restart: unless-stopped
    pid: host
    environment:
      GLANCES_OPT: "-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:61208/api/4/status', timeout=5).status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=nuvemax_edge
      - traefik.http.routers.monitor.rule=Host(`${MONITOR_DOMAIN:?defina MONITOR_DOMAIN no .env}`)
      - traefik.http.routers.monitor.entrypoints=websecure
      - traefik.http.routers.monitor.tls=true
      - traefik.http.routers.monitor.tls.certresolver=letsencrypt
      - traefik.http.routers.monitor.middlewares=monitor-auth@file
      - traefik.http.services.monitor.loadbalancer.server.port=61208
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: nuvemax_edge
