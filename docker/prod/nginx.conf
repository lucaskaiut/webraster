server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 100M;

    # Saúde para o load balancer (Traefik / healthcheck do container).
    # O arquivo public/healthz.txt é criado no boot e removido pelo deploy
    # para "drenar" o slot: o LB marca como DOWN e para de mandar tráfego novo,
    # enquanto o slot continua atendendo as requisições em andamento.
    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz.txt =503;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
